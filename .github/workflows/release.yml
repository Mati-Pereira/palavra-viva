name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da release (ex.: v0.2.0)'
        required: true
        default: 'v0.2.0'
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Resolve release version
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          VERSION_NAME="${TAG#v}"
          VERSION_CODE="$(( ${GITHUB_RUN_NUMBER:-1} + 1 ))"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Preparando release $TAG (versionName=$VERSION_NAME, versionCode=$VERSION_CODE)"

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build installable APK
        run: >
          gradle :app:assembleDebug --no-daemon
          -PversionName="${{ steps.meta.outputs.version_name }}"
          -PversionCode="${{ steps.meta.outputs.version_code }}"

      - name: Package APK
        shell: bash
        run: |
          APK_SOURCE="app/build/outputs/apk/debug/app-debug.apk"
          APK_TARGET="palavra-viva-${{ steps.meta.outputs.tag }}.apk"
          cp "$APK_SOURCE" "$APK_TARGET"
          ls -lh "$APK_TARGET"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          RELEASE_TAG="${{ steps.meta.outputs.tag }}"
          APK_FILE="palavra-viva-${RELEASE_TAG}.apk"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK_FILE" --clobber
          else
            gh release create "$RELEASE_TAG" "$APK_FILE" \
              --title "Palavra Viva $RELEASE_TAG" \
              --generate-notes
          fi

      - name: Keep only the 3 most recent releases
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_RELEASES: '3'
        shell: bash
        run: |
          OLD_TAGS=$(gh api "repos/${{ github.repository }}/releases?per_page=100" \
            --jq "sort_by(.created_at) | reverse | .[$MAX_RELEASES:] | map(select(.tag_name != null and .tag_name != \"\")) | .[].tag_name")
          if [ -z "$OLD_TAGS" ]; then
            echo "Menos ou exatamente $MAX_RELEASES releases ativas; nada a remover."
            exit 0
          fi
          while IFS= read -r old_tag; do
            if [ -n "$old_tag" ]; then
              echo "Removendo release antiga para manter limite de $MAX_RELEASES: $old_tag"
              gh release delete "$old_tag" --yes
            fi
          done <<< "$OLD_TAGS"
